<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101426" />
    <title>قرارمون ثبت شد ❤️</title>
    <link rel="stylesheet" href="css/page4.css" />
  </head>
  <body>
    <div class="background">
      <div class="glow glow-pink"></div>
      <div class="glow glow-blue"></div>
      <div class="glow glow-purple"></div>
    </div>

    <main class="page">
      <section class="card">
        <header class="header">
          <div class="emoji">🎉</div>
          <h1>❤️ قرارمون ثبت شد!</h1>
          <p class="subtitle">
            🕺✨ یه پیاده‌روی عالی با استشمام هوای تازه منتظر مونه!
          </p>
        </header>

        <div class="cost-box">
          <div class="cost-row">
            <span>هزینه کل:</span>
            <strong>تومان</strong>
          </div>

          <div class="cost-row your-cost">
            <span>هزینه شما:</span>
            <strong>۵۰۰ هزار تومان</strong>
          </div>
        </div>

        <form class="phone-form">
          <label for="phone">📱 شماره موبایلت رو وارد کن</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="مثلاً 09123456789"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="11"
            required
          />

          <p class="call-message">زنگ می‌زنم بهت، سریعاً ❤️</p>

          <button type="submit" class="continue-button">ثبت شماره 💗</button>

          <p class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="JS/page4.js" defer></script>
  </body>
</html>
