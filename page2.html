<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101426" />
    <title>قرارمون کجا باشه؟</title>
    <link rel="stylesheet" href="./css/page2.css" />
  </head>

  <body>
    <div class="background">
      <div class="glow glow-pink"></div>
      <div class="glow glow-blue"></div>
      <div class="glow glow-purple"></div>
    </div>

    <main class="page">
      <section class="card">
        <header class="header">
          <div class="emoji">😉</div>

          <h1>میدونستم جوابت مثبته!</h1>

          <p class="subtitle">🌷 حالا بگو برناممون چی باشه؟ کجا بریم؟</p>
        </header>

        <form class="date-form" novalidate>
          <div class="options">
            <label class="option">
              <input type="radio" name="date" value="restaurant" />
              <span class="option-content">
                <span class="option-text">رستوران</span>
                <span class="option-emoji">🍕</span>
                <span class="radio"></span>
              </span>
            </label>

            <label class="option">
              <input type="radio" name="date" value="cafe" />
              <span class="option-content">
                <span class="option-text">کافی‌شاپ</span>
                <span class="option-emoji">☕</span>
                <span class="radio"></span>
              </span>
            </label>

            <label class="option">
              <input type="radio" name="date" value="cinema" />
              <span class="option-content">
                <span class="option-text">سینما</span>
                <span class="option-emoji">🎬</span>
                <span class="radio"></span>
              </span>
            </label>

            <label class="option">
              <input type="radio" name="date" value="walk" />
              <span class="option-content">
                <span class="option-text">پیاده‌روی</span>
                <span class="option-emoji">🚶‍♂️</span>
                <span class="radio"></span>
              </span>
            </label>
          </div>

          <button class="continue-button" type="submit">❤️ ادامه</button>
        </form>
      </section>
    </main>

    <script src="./JS/page2.js" defer></script>
  </body>
</html>
